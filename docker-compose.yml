services:
  mysql-server-1:
    container_name: mysql-server-1
    env_file:
      - ./mysql/mysql-server.env
    image: mysql:8.4.7
    ports:
      - "3301:3306"
    command: ["mysqld","--server_id=1","--gtid_mode=ON","--enforce_gtid_consistency=ON",
              "--report_host=mysql-server-1","--loose-group_replication_local_address=mysql-server-1:33061",
              "--sql_generate_invisible_primary_key=ON"]
    volumes:
      - mysql-data-1:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmysql"]
      timeout: 10s
      retries: 20
      interval: 5s
      start_period: 15s

  mysql-server-2:
    container_name: mysql-server-2
    env_file:
      - ./mysql/mysql-server.env
    image: mysql:8.4.7
    ports:
      - "3302:3306"
    command: ["mysqld","--server_id=2","--gtid_mode=ON","--enforce_gtid_consistency=ON",
              "--report_host=mysql-server-2","--loose-group_replication_local_address=mysql-server-2:33061",
              "--sql_generate_invisible_primary_key=ON"]
    volumes:
      - mysql-data-2:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmysql"]
      timeout: 10s
      retries: 20
      interval: 5s
      start_period: 15s

  mysql-server-3:
    container_name: mysql-server-3
    env_file:
      - ./mysql/mysql-server.env
    image: mysql:8.4.7
    ports:
      - "3303:3306"
    command: ["mysqld","--server_id=3","--gtid_mode=ON","--enforce_gtid_consistency=ON",
              "--report_host=mysql-server-3","--loose-group_replication_local_address=mysql-server-3:33061",
              "--sql_generate_invisible_primary_key=ON"]
    volumes:
      - mysql-data-3:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmysql"]
      timeout: 10s
      retries: 20
      interval: 5s
      start_period: 15s

  # 3) mysql-shell runs once, sets up cluster + creates ninja DB/user, then exits 0
  mysql-shell:
    container_name: mysql-shell
    image: mysql:8.4.7
    volumes:
      - ./mysql/shell:/scripts
    depends_on:
      mysql-server-1:
        condition: service_healthy
      mysql-server-2:
        condition: service_healthy
      mysql-server-3:
        condition: service_healthy
    restart: "no"
    command: >
      sh -c "chmod +x /scripts/entrypoint.sh && exec /scripts/entrypoint.sh"

  # 4) mysql-router starts only after mysql-shell completes successfully
  mysql-router:
    image: container-registry.oracle.com/mysql/community-router:8.4.7
    container_name: mysql-router
    ports:
      - "6446:6446"   # Read/Write port
      - "6447:6447"   # Read-Only port
      - "6448:6448"   # Classic MySQL protocol port
    env_file:
      - ./mysql/mysql-router.env
    depends_on:
      mysql-shell:
        condition: service_completed_successfully
    restart: on-failure
    # Use a TCP check so we don't depend on mysqladmin existing in the router image
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'echo > /dev/tcp/127.0.0.1/6446'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  # 5) phpmyadmin after router healthy
  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin/phpmyadmin
    ports:
      - "81:80"
    environment:
      PMA_HOST: mysql-router
      PMA_PORT: 6446
      PMA_USER: root
      PMA_PASSWORD: mysql
    depends_on:
      mysql-router:
        condition: service_healthy
    restart: unless-stopped

  # 6) invoiceninja after router healthy
  invoiceninja:
    container_name: invoiceninja
    build:
      context: ./invoiceninja
    image: invoiceninja/invoiceninja-debian:latest
    restart: unless-stopped
    env_file:
      - ./invoiceninja/.env
    volumes:
      - invoiceninja_public:/var/www/html/public
      - invoiceninja_storage:/var/www/html/storage
    depends_on:
      mysql-router:
        condition: service_healthy

  # 7) nginx after invoiceninja starts
  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./invoiceninja/nginx:/etc/nginx/conf.d:ro
      - invoiceninja_public:/var/www/html/public:ro
      - invoiceninja_storage:/var/www/html/storage:ro
    depends_on:
      invoiceninja:
        condition: service_started

volumes:
  mysql-data-1:
  mysql-data-2:
  mysql-data-3:
  invoiceninja_public:
    driver: local
  invoiceninja_storage:
    driver: local

networks:
  default:
    name: laravelmmdhappyforeverir_network
